<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행복 자판기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#344334; --leaf:#4f8b5f; --deep:#2d6843; --cream:#fffaf0; --paper:#fffdf6; --peach:#ffd7b2; --line:#dfebdc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 8% 4%,#fff 0 5%,transparent 24%),linear-gradient(135deg,#f4f8ed,#fff6ea 55%,#f0f8ee); color:var(--ink); font-family:"Gowun Dodum",sans-serif; }
    button, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(1100px,calc(100% - 32px)); margin:auto; padding:28px 0 44px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:10px; font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:23px; letter-spacing:-1px; }
    .brand-mark { width:27px; height:27px; position:relative; transform:rotate(-12deg); }
    nav { display:flex; gap:5px; background:#ffffff9e; border:1px solid var(--line); padding:5px; border-radius:99px; }
    .tab { border:0; background:transparent; padding:10px 16px; border-radius:99px; color:#758475; transition:.2s; }
    .tab.active { background:var(--deep); color:#fff; box-shadow:0 3px 10px #2d68442c; }
    main { background:#ffffffa6; border:1px solid #fff; border-radius:30px; min-height:650px; overflow:hidden; box-shadow:0 18px 65px #6e927526; }
    .screen { display:none; padding:clamp(28px,6vw,70px); min-height:650px; }
    .screen.active { display:block; }
    .eyebrow { color:var(--leaf); font-size:14px; margin:0 0 9px; letter-spacing:.03em; }
    h1 { font-family:"Nanum Myeongjo",serif; font-size:clamp(31px,5vw,50px); line-height:1.32; margin:0 0 16px; letter-spacing:-2px; }
    .lead { color:#718071; line-height:1.75; margin:0; }
    .write-layout { display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(30px,7vw,92px); align-items:center; }
    .memo-card { background:var(--paper); border:1px solid #ebe5d9; border-radius:18px; padding:22px; margin-top:30px; box-shadow:0 9px 22px #77664b12; position:relative; }
    .memo-card::before { content:""; position:absolute; inset:10px -8px -8px 8px; background:#f4eadb; border-radius:18px; z-index:-1; transform:rotate(1.5deg); }
    .memo-card.folding { animation:paper-fold .8s ease-in forwards; pointer-events:none; }
    @keyframes paper-fold { 0%{transform:perspective(700px) rotateX(0) scale(1);opacity:1} 34%{transform:perspective(700px) rotateX(72deg) scale(.92)} 57%{transform:perspective(700px) rotateY(-78deg) scale(.65)} 100%{transform:scale(.12) rotate(20deg);opacity:0} }
    .folding-clover { position:absolute; width:46px; height:54px; right:calc(50% - 23px); top:37%; z-index:3; opacity:0; transform:scale(0) rotate(-45deg); pointer-events:none; }
    .folding-clover.show { animation:unfold-clover .82s .45s steps(6,end) forwards; }
    @keyframes unfold-clover { 0%{opacity:0;transform:scale(0) rotate(-45deg)} 32%{opacity:1;transform:scale(.35) rotate(8deg)} 70%{opacity:1;transform:scale(.82) rotate(-4deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }
    textarea { width:100%; height:152px; border:0; outline:0; resize:none; background:transparent; color:var(--ink); font-size:17px; line-height:1.75; }
    textarea::placeholder { color:#abb4a8; }
    .memo-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #dce4d7; padding-top:14px; color:#9aa69a; font-size:13px; }
    .save { border:0; border-radius:12px; padding:12px 18px; color:#fff; background:var(--deep); box-shadow:0 4px 10px #2d684433; }
    .save:hover { background:#215635; }
    .jar-stage { position:relative; min-height:420px; display:grid; place-items:center; }
    .jar-stage::before { content:""; width:340px; height:340px; position:absolute; background:#e4f1dc; border-radius:50%; opacity:.7; }
    .jar { width:230px; height:286px; position:relative; z-index:1; filter:drop-shadow(0 17px 12px #63836335); }
    .lid { width:142px; height:38px; background:linear-gradient(#e7d1ab,#be9669); border:4px solid #a67d53; border-radius:10px 10px 4px 4px; position:absolute; top:5px; left:44px; z-index:2; transform-origin:12% 100%; }
    .lid::after { content:""; position:absolute; inset:9px 0; border-top:2px solid #96714e; border-bottom:2px solid #96714e; }
    .glass { position:absolute; top:36px; left:12px; width:206px; height:244px; border:5px solid #a9cdbd; border-top-color:#d1e5db; border-radius:23px 23px 55px 55px; background:linear-gradient(110deg,#ffffff9b,#d8f0e682 40%,#a1d0bc82); overflow:hidden; }
    .glass::after { content:""; position:absolute; left:21px; top:18px; width:16px; height:142px; border-radius:20px; background:#fff9; transform:rotate(8deg); }
    .clovers { position:absolute; inset:38px 17px 14px; }
    .clover { position:absolute; width:43px; height:43px; filter:drop-shadow(0 2px 1px #225c4230); transform:rotate(var(--r)); }
    .clover .dot { display:none; }
    .clover::before { content:""; position:absolute; width:40px; height:40px; background:radial-gradient(circle at 28% 28%,#a9d99d 0 7%,transparent 8%),radial-gradient(circle at 30% 30%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 70% 30%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 30% 70%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 70% 70%,#5d9d67 0 26%,transparent 27%); }
    .clover::after { content:none; }
    .brand-mark::before { content:""; position:absolute; width:25px; height:25px; background:radial-gradient(circle at 30% 30%,#6fae71 0 27%,transparent 28%),radial-gradient(circle at 70% 30%,#6fae71 0 27%,transparent 28%),radial-gradient(circle at 30% 70%,#6fae71 0 27%,transparent 28%),radial-gradient(circle at 70% 70%,#6fae71 0 27%,transparent 28%); }
    .brand-mark::after { content:none; }
    .clover:nth-child(1){left:9%;top:56%;--r:-23deg}.clover:nth-child(2){left:45%;top:65%;--r:17deg}.clover:nth-child(3){left:67%;top:38%;--r:-17deg}.clover:nth-child(4){left:34%;top:29%;--r:19deg}.clover:nth-child(5){left:6%;top:8%;--r:-8deg}.clover:nth-child(6){left:68%;top:6%;--r:14deg}
    .jar-note { text-align:center; color:#759075; margin:14px 0 0; font-size:14px; position:relative; }
    .draw-layout { text-align:center; display:flex; flex-direction:column; align-items:center; }
    .draw-layout .lead { max-width:450px; }
    .draw-jar { margin:24px 0 12px; transform:scale(1.05); transform-origin:bottom; }
    .draw-jar.shake { animation:shake .8s ease-in-out; }
    .draw-jar.opening .lid { animation:open-lid .68s .64s cubic-bezier(.25,.8,.3,1) forwards; }
    .draw-jar.opening .glass { overflow:visible; }
    @keyframes open-lid { to { transform:translate(-18px,-55px) rotate(-28deg); } }
    .picked-clover { position:absolute; z-index:5; left:88px; top:124px; opacity:0; transform:scale(.2) rotate(-30deg); }
    .picked-clover.pop { animation:clover-pop 1s .8s cubic-bezier(.2,.9,.25,1.1) forwards; }
    @keyframes clover-pop { 0%{opacity:0;transform:scale(.2) translateY(0) rotate(-30deg)} 25%{opacity:1} 70%{opacity:1;transform:scale(1.32) translateY(-184px) rotate(15deg)} 100%{opacity:0;transform:scale(1.02) translateY(-210px) rotate(4deg)} }
    @keyframes shake { 0%,100%{transform:scale(1.05) rotate(0)} 15%{transform:scale(1.05) rotate(-9deg)} 30%{transform:scale(1.05) rotate(8deg)} 45%{transform:scale(1.05) rotate(-7deg)} 60%{transform:scale(1.05) rotate(5deg)} 75%{transform:scale(1.05) rotate(-3deg)} }
    .draw { border:0; border-radius:99px; color:#fff; background:var(--deep); padding:15px 27px; box-shadow:0 7px 15px #2d684442; transition:.2s; }
    .draw:hover { transform:translateY(-2px); }
    .empty { color:#8e9c8d; margin-top:3px; font-size:14px; }
    .result { width:min(480px,100%); margin-top:28px; background:var(--paper); border:1px solid #eadfcd; padding:27px 26px 22px; border-radius:16px; box-shadow:0 15px 30px #6b70591b; text-align:left; animation:appear .35s ease-out; position:relative; }
    .result::before { content:""; position:absolute; right:23px; top:-14px; width:28px; height:28px; background:radial-gradient(circle at 30% 30%,#a9d99d 0 7%,transparent 8%),radial-gradient(circle at 30% 30%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 70% 30%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 30% 70%,#5d9d67 0 26%,transparent 27%),radial-gradient(circle at 70% 70%,#5d9d67 0 26%,transparent 27%); }
    .result::after { content:none; }
    @keyframes appear { from { opacity:0; transform:translateY(18px) rotate(-2deg); } to { opacity:1; transform:none; } }
    .result p { white-space:pre-wrap; line-height:1.8; margin:0 0 16px; font-size:17px; }
    .tags { display:flex; flex-wrap:wrap; gap:7px; }
    .tag { color:#407a50; background:#e9f4e7; padding:4px 9px; border-radius:99px; font-size:13px; }
    .message { color:#c46451; font-size:14px; height:18px; margin:8px 0 0; }
    @media (max-width:700px) { .app{width:min(100% - 20px,540px);padding-top:15px}.brand{font-size:20px} header{margin-bottom:17px}.tab{padding:8px 11px;font-size:13px} main,.screen{min-height:0}.screen{padding:35px 22px 43px}.write-layout{grid-template-columns:1fr}.jar-stage{min-height:280px;order:-1}.jar-stage::before{width:250px;height:250px}.jar{transform:scale(.78);margin:-44px}.draw-jar{margin:2px -10px 4px;transform:scale(.8)}.draw-jar.shake{animation:shake-mobile .8s ease-in-out}@keyframes shake-mobile{0%,100%{transform:scale(.8) rotate(0)}20%{transform:scale(.8) rotate(-10deg)}40%{transform:scale(.8) rotate(8deg)}60%{transform:scale(.8) rotate(-6deg)}80%{transform:scale(.8) rotate(4deg)}} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>행복 자판기</div>
      <nav aria-label="주요 메뉴"><button class="tab active" data-screen="write">행복 담기</button><button class="tab" data-screen="draw">행복 뽑기</button></nav>
    </header>
    <main>
      <section id="write" class="screen active">
        <div class="write-layout">
          <div>
            <p class="eyebrow">오늘의 작은 행운</p>
            <h1>마음이 환해졌던<br>순간을 담아보세요.</h1>
            <p class="lead">사소해서 더 소중한 기쁨도 괜찮아요.<br>힘든 날, 이 병 속의 당신을 다시 만나게 될 거예요.</p>
            <div class="memo-card" id="memoCard">
              <textarea id="memo" maxlength="500" placeholder="오늘 어떤 순간이 행복했나요?&#10;#친구 #가족처럼 태그도 붙여보세요."></textarea>
              <div class="memo-footer"><span id="count">0 / 500</span><button class="save" id="save">네잎클로버로 접기</button></div>
              <span class="clover folding-clover" id="foldingClover" aria-hidden="true"></span>
            </div>
            <p class="message" id="saveMessage" aria-live="polite"></p>
          </div>
          <div class="jar-stage">
            <div class="jar" aria-label="행복 메모가 든 유리병"><div class="lid"></div><div class="glass"><div class="clovers" id="writeClovers"></div></div></div>
            <p class="jar-note"><span id="memoTotal">0</span>개의 행복이 차곡차곡 쌓였어요</p>
          </div>
        </div>
      </section>
      <section id="draw" class="screen">
        <div class="draw-layout">
          <p class="eyebrow">당신에게 도착한 한 장</p>
          <h1>오늘은 어떤 행복을<br>다시 꺼내볼까요?</h1>
          <p class="lead">병을 살며시 흔들어보세요.<br>과거의 내가 남긴 따뜻한 마음이 나올 거예요.</p>
          <div class="jar draw-jar" id="drawJar"><div class="lid"></div><div class="glass"><div class="clovers" id="drawClovers"></div></div><span class="clover picked-clover" id="pickedClover" aria-hidden="true"></span></div>
          <button class="draw" id="drawButton">유리병 흔들기</button>
          <p class="empty" id="drawCount"></p>
          <div class="result" id="result" hidden><p id="resultText"></p><div class="tags" id="resultTags"></div></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const STORE = 'happy-vending-memos-v1';
    const $ = s => document.querySelector(s);
    const getMemos = () => JSON.parse(localStorage.getItem(STORE) || '[]');
    const pixelPattern=[[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[4,1],[5,1],[6,1],[1,2],[2,2],[3,2],[4,2],[5,2],[1,3],[2,3],[3,3],[4,3],[5,3],[0,4],[1,4],[2,4],[4,4],[5,4],[6,4],[1,5],[2,5],[4,5],[5,5]];
    function fillClover(c) { if(c.children.length) return c; pixelPattern.forEach(([x,y])=>{const dot=document.createElement('i');dot.className='dot';dot.style.left=`${x*8}px`;dot.style.top=`${y*8}px`;c.append(dot);}); return c; }
    const makeClover = () => { const c=document.createElement('span'); c.className='clover'; return fillClover(c); };
    function renderJar(id, max=6) { const host=$(id); host.replaceChildren(); const n=Math.min(Math.max(getMemos().length, 1),max); for(let i=0;i<n;i++) host.append(makeClover()); }
    function refresh() { const n=getMemos().length; $('#memoTotal').textContent=n; $('#drawCount').textContent=n ? `유리병에 ${n}개의 행복이 기다리고 있어요` : '먼저 행복을 한 장 담아주세요'; renderJar('#writeClovers'); renderJar('#drawClovers'); }
    $('.tab[data-screen="write"]').addEventListener('click', () => show('write'));
    $('.tab[data-screen="draw"]').addEventListener('click', () => show('draw'));
    function show(id) { document.querySelectorAll('.screen,.tab').forEach(e=>e.classList.remove('active')); $('#'+id).classList.add('active'); document.querySelector(`.tab[data-screen="${id}"]`).classList.add('active'); refresh(); }
    $('#memo').addEventListener('input', e => $('#count').textContent=`${e.target.value.length} / 500`);
    $('#save').addEventListener('click', () => { const text=$('#memo').value.trim(); const message=$('#saveMessage'); if(!text){message.textContent='행복했던 순간을 먼저 적어주세요.';return;} const tags=[...text.matchAll(/(^|\s)#([\w가-힣]+)/g)].map(m=>m[2]); const memo={text,tags,createdAt:Date.now()}; const card=$('#memoCard'), clover=$('#foldingClover'); card.classList.remove('folding'); clover.classList.remove('show'); void card.offsetWidth; card.classList.add('folding'); clover.classList.add('show'); setTimeout(()=>{ localStorage.setItem(STORE,JSON.stringify([...getMemos(),memo])); $('#memo').value=''; $('#count').textContent='0 / 500'; card.classList.remove('folding'); clover.classList.remove('show'); message.textContent='네잎클로버로 접어 유리병에 담았어요.'; refresh(); },1250); });
    $('#drawButton').addEventListener('click', () => { const memos=getMemos(); if(!memos.length){show('write');$('#saveMessage').textContent='행복을 한 장 담은 뒤 다시 와주세요.';return;} const jar=$('#drawJar'), picked=$('#pickedClover'); jar.classList.remove('shake','opening'); picked.classList.remove('pop'); void jar.offsetWidth; jar.classList.add('shake','opening'); picked.classList.add('pop'); $('#result').hidden=true; setTimeout(()=>{ const memo=memos[Math.floor(Math.random()*memos.length)]; $('#resultText').textContent=memo.text.replace(/(^|\s)#[\w가-힣]+/g,'').trim(); const tags=$('#resultTags'); tags.replaceChildren(...memo.tags.map(t=>{const s=document.createElement('span');s.className='tag';s.textContent='#'+t;return s;})); if(!memo.tags.length) tags.replaceChildren(); $('#result').hidden=false; },1600); });
    document.querySelectorAll('.clover').forEach(fillClover);
    refresh();
  </script>
</body>
</html>
